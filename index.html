<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Mario: Easy Steps Curriculum Adventure</title>
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    padding: 10px 0;
    background: #11121a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
  }
  #header {
    width: 980px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
  }
  .hud-badge {
    background: #202232;
    padding: 6px 14px;
    border-radius: 20px;
    border: 2px solid #3d405b;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 14px;
  }
  .header-btns {
    display: flex;
    gap: 10px;
  }
  #btn-replay {
    cursor: pointer;
    background: #e63946;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 13px;
    box-shadow: 0 4px #9d0208;
    transition: transform 0.1s;
  }
  #btn-replay:hover { transform: translateY(-2px); }
  #btn-replay:active { transform: translateY(2px); box-shadow: 0 2px #9d0208; }

  #btn-admin-skip {
    cursor: pointer;
    background: #8338ec;
    color: #fff;
    border: 2px solid #c77dff;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 13px;
    box-shadow: 0 4px #5a189a;
    transition: transform 0.1s;
  }
  #btn-admin-skip:hover { transform: translateY(-2px); background: #9d4edd; }
  #btn-admin-skip:active { transform: translateY(2px); box-shadow: 0 2px #5a189a; }

  #game-container {
    position: relative;
    width: 980px;
    height: 450px;
    background: #5c94fc;
    border: 4px solid #111;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 12px 36px rgba(0,0,0,0.65);
    transition: background 0.4s;
  }

  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 64px;
    background: 
      linear-gradient(45deg, #d35400 25%, transparent 25%, transparent 75%, #d35400 75%),
      linear-gradient(45deg, #d35400 25%, transparent 25%, transparent 75%, #d35400 75%),
      #e67e22;
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    border-top: 6px solid #27ae60;
    z-index: 10;
  }

  .ground.world-2-ground {
    background: 
      radial-gradient(circle at 4px 4px, #4a1900 2px, transparent 2px),
      radial-gradient(circle at 12px 12px, #fce4d6 1.5px, transparent 1.5px),
      linear-gradient(45deg, #a64219 25%, #c85a2b 25%, #c85a2b 50%, #a64219 50%, #a64219 75%, #c85a2b 75%);
    background-size: 16px 16px;
    border-top: 4px solid #000;
  }

  .ground.world-3-water {
    background: #3bb2ff;
    border-top: none;
  }
  .ground.world-3-water::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 12px;
    background: radial-gradient(circle at 8px 0, transparent 8px, #fff 9px, #fff 11px, transparent 12px);
    background-size: 16px 12px;
  }

  .ground.world-4-grass {
    background: #50d060;
    background-image: radial-gradient(circle, #000 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    border-top: 4px solid #000;
  }

  .ground.world-5-rocky {
    background: 
      radial-gradient(circle at 4px 4px, #000 2.5px, transparent 3px),
      radial-gradient(circle at 12px 12px, #fff 1.5px, transparent 2px),
      linear-gradient(45deg, #d35400 25%, #e67e22 25%, #e67e22 50%, #a04000 50%, #a04000 75%, #e67e22 75%);
    background-size: 16px 16px;
    border-top: 4px solid #000;
  }

  .ground.world-8-ground {
    background: 
      linear-gradient(45deg, #b84418 25%, transparent 25%, transparent 75%, #b84418 75%),
      linear-gradient(45deg, #b84418 25%, transparent 25%, transparent 75%, #b84418 75%),
      #c85a2b;
    background-size: 16px 16px;
    border-top: 4px solid #000;
  }

  .ground.world-7-ground {
    background: 
      linear-gradient(45deg, #d98880 25%, transparent 25%, transparent 75%, #d98880 75%),
      linear-gradient(45deg, #d98880 25%, transparent 25%, transparent 75%, #d98880 75%),
      #e59866;
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    border-top: 6px solid #27ae60;
  }

  #left-big-castle, #right-small-castle {
    position: absolute;
    bottom: 64px;
    z-index: 8;
    pointer-events: none;
  }
  #left-big-castle { left: 0; width: 140px; height: 250px; }
  #right-small-castle { left: 840px; width: 130px; height: 140px; }

  #mario {
    position: absolute;
    width: 16px;
    height: 16px;
    bottom: 64px;
    left: 88px;
    transform-origin: bottom center;
    image-rendering: pixelated;
    z-index: 15;
  }
  .mario-pixel {
    width: 1px;
    height: 1px;
    background: transparent;
    box-shadow:
      3px 1px #d62828, 4px 1px #d62828, 5px 1px #d62828, 6px 1px #d62828, 7px 1px #d62828,
      2px 2px #d62828, 3px 2px #d62828, 4px 2px #d62828, 5px 2px #d62828, 6px 2px #d62828, 7px 2px #d62828, 8px 2px #d62828, 9px 2px #d62828,
      2px 3px #5e3023, 3px 3px #5e3023, 4px 3px #5e3023, 5px 3px #f4a261, 6px 3px #000, 7px 3px #f4a261,
      1px 4px #5e3023, 2px 4px #f4a261, 3px 4px #5e3023, 4px 4px #f4a261, 5px 4px #f4a261, 6px 4px #f4a261, 7px 4px #000, 8px 4px #f4a261, 9px 4px #f4a261, 10px 4px #f4a261,
      1px 5px #5e3023, 2px 5px #f4a261, 3px 5px #5e3023, 4px 5px #5e3023, 5px 5px #f4a261, 6px 5px #f4a261, 7px 5px #f4a261, 8px 5px #000, 9px 5px #000, 10px 5px #000,
      2px 6px #5e3023, 3px 6px #f4a261, 4px 6px #f4a261, 5px 6px #f4a261, 6px 6px #f4a261, 7px 6px #f4a261, 8px 6px #f4a261,
      3px 7px #d62828, 4px 7px #d62828, 5px 7px #d62828, 6px 7px #d62828, 7px 7px #d62828,
      2px 8px #d62828, 3px 8px #d62828, 4px 8px #0077b6, 5px 8px #d62828, 6px 8px #d62828, 7px 8px #0077b6, 8px 8px #d62828, 9px 8px #d62828,
      1px 9px #d62828, 2px 9px #d62828, 3px 9px #0077b6, 4px 9px #0077b6, 5px 9px #0077b6, 6px 9px #0077b6, 7px 9px #0077b6, 8px 9px #0077b6, 9px 9px #d62828, 10px 9px #d62828,
      1px 10px #f4a261, 2px 10px #f4a261, 3px 10px #0077b6, 4px 10px #fcbf49, 5px 10px #0077b6, 6px 10px #0077b6, 7px 10px #fcbf49, 8px 10px #0077b6, 9px 10px #f4a261, 10px 10px #f4a261,
      3px 11px #0077b6, 4px 11px #0077b6, 5px 11px #0077b6, 6px 11px #0077b6, 7px 11px #0077b6, 8px 11px #0077b6,
      2px 12px #0077b6, 3px 12px #0077b6, 4px 12px #0077b6, 5px 12px #0077b6, 6px 12px #0077b6, 7px 12px #0077b6, 8px 12px #0077b6, 9px 12px #0077b6,
      2px 13px #5e3023, 3px 13px #5e3023, 4px 13px #5e3023, 7px 13px #5e3023, 8px 13px #5e3023, 9px 13px #5e3023,
      1px 14px #5e3023, 2px 14px #5e3023, 3px 14px #5e3023, 7px 14px #5e3023, 8px 14px #5e3023, 9px 14px #5e3023, 10px 14px #5e3023;
  }

  .solid-brick {
    position: absolute;
    width: 56px;
    height: 56px;
    background: #b84418;
    border: 2px solid #000;
    box-shadow: inset 0 4px 0 #fce4d6, inset 0 -4px 0 #5c1800;
    background-image: 
      linear-gradient(to bottom, transparent 26px, #000 26px, #000 28px, transparent 28px),
      linear-gradient(to right, transparent 26px, #000 26px, #000 28px, transparent 28px);
    z-index: 6;
  }
  .solid-brick.hit-bounce { animation: blockBounce 0.16s ease-out; }

  .slab-brick {
    position: absolute;
    background: #b84418;
    border: 3px solid #000;
    box-shadow: inset 0 6px 0 #fce4d6, inset 0 -5px 0 #5c1800;
    z-index: 6;
  }
  .slab-brick::after {
    content: "";
    position: absolute;
    top: 6px;
    right: 18px;
    bottom: 5px;
    width: 3px;
    background: #000;
  }

  .bevel-block {
    position: absolute;
    width: 32px;
    height: 32px;
    background: #c66020;
    border: 3px solid #000;
    box-shadow: inset 3px 3px 0 #fcd0a1, inset -3px -3px 0 #5c1800;
    z-index: 5;
  }

  .block {
    position: absolute;
    min-width: 60px;
    height: 56px;
    background: #fc9838;
    border: 3px solid #000;
    border-radius: 4px;
    box-shadow: inset 3px 3px 0 #ffe0b2, inset -3px -3px 0 #b35900;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #4a2800;
    cursor: pointer;
    z-index: 7;
    transition: width 0.1s ease-out;
    padding: 1px 4px;
    overflow: hidden;
  }
  .block-zh-row {
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1;
  }
  .block-text-char {
    font-size: 21px;
    font-weight: 900;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.45);
  }
  .block.multi-char .block-text-char { font-size: 16px; }

  .block-sub-en {
    font-size: 13px;
    font-weight: 800;
    color: #1f0e02;
    text-align: center;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    max-width: 100%;
    margin-top: 1px;
    line-height: 1.1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: -0.2px;
  }

  .block::before, .block::after {
    content: ""; position: absolute; width: 3px; height: 3px; background: #000; z-index: 2;
  }
  .block::before { top: 2px; left: 2px; }
  .block::after { bottom: 2px; left: 2px; }
  .block-corner-dots {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
  }
  .block-corner-dots::before, .block-corner-dots::after {
    content: ""; position: absolute; width: 3px; height: 3px; background: #000;
  }
  .block-corner-dots::before { top: 2px; right: 2px; }
  .block-corner-dots::after { bottom: 2px; right: 2px; }

  .block.w4-strip-block {
    background: #fc9838;
    border-radius: 4px;
    box-shadow: inset 3px 3px 0 #ffe0b2, inset -3px -3px 0 #b35900;
    border: 3px solid #000;
  }

  .block.hit-bounce { animation: blockBounce 0.16s ease-out; }
  @keyframes blockBounce {
    0% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
    100% { transform: translateY(0); }
  }

  .hint-fly-pop {
    position: absolute;
    background: rgba(0, 0, 0, 0.95);
    color: #00ffff;
    font-size: 20px;
    font-weight: 900;
    padding: 6px 14px;
    border-radius: 8px;
    white-space: nowrap;
    border: 3px solid #f39c12;
    box-shadow: 0 8px 22px rgba(0,0,0,0.7);
    animation: hintFlyUp 0.9s ease-out forwards;
    pointer-events: none;
    z-index: 50;
  }
  @keyframes hintFlyUp {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    30% { transform: translateY(-35px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-80px) scale(1); opacity: 0; }
  }

  .piranha-plant {
    position: absolute;
    width: 36px;
    height: 48px;
    z-index: 6;
    pointer-events: none;
    transition: transform 0.05s linear;
  }
  .piranha-head {
    width: 36px;
    height: 32px;
    animation: piranhaChomp 0.45s infinite alternate ease-in-out;
    transform-origin: bottom center;
  }
  @keyframes piranhaChomp {
    0% { transform: scaleY(0.85); }
    100% { transform: scaleY(1.05); }
  }

  .hammer-bro {
    position: absolute;
    width: 32px;
    height: 44px;
    z-index: 9;
    image-rendering: pixelated;
  }
  .hammer-bro.flattened {
    transform: scaleY(0.4) translateY(24px) !important;
  }

  .stage5-enemy {
    position: absolute;
    z-index: 9;
    image-rendering: pixelated;
  }
  .stage5-enemy.flattened {
    transform: scaleY(0.3) translateY(18px) !important;
  }

  .goomba {
    position: absolute;
    width: 16px;
    height: 16px;
    bottom: 58px;
    transform: scale(2.5);
    transform-origin: bottom center;
    image-rendering: pixelated;
    z-index: 9;
  }
  .goomba-pixel {
    width: 1px;
    height: 1px;
    background: transparent;
    box-shadow:
      6px 1px #9c4100, 7px 1px #9c4100, 8px 1px #9c4100, 9px 1px #9c4100,
      5px 2px #9c4100, 6px 2px #9c4100, 7px 2px #9c4100, 8px 2px #9c4100, 9px 2px #9c4100, 10px 2px #9c4100,
      4px 3px #9c4100, 5px 3px #9c4100, 6px 3px #9c4100, 7px 3px #9c4100, 8px 3px #9c4100, 9px 3px #9c4100, 10px 3px #9c4100, 11px 3px #9c4100,
      3px 4px #9c4100, 4px 4px #9c4100, 5px 4px #fff, 6px 4px #000, 7px 4px #9c4100, 8px 4px #9c4100, 9px 4px #000, 10px 4px #fff, 11px 4px #9c4100, 12px 4px #9c4100,
      2px 5px #9c4100, 3px 5px #9c4100, 4px 5px #fff, 5px 5px #fff, 6px 5px #000, 7px 5px #9c4100, 8px 5px #9c4100, 9px 5px #000, 10px 5px #fff, 11px 5px #fff, 12px 5px #9c4100, 13px 5px #9c4100,
      1px 6px #9c4100, 2px 6px #9c4100, 3px 6px #9c4100, 4px 6px #fff, 5px 6px #000, 6px 6px #9c4100, 7px 6px #9c4100, 8px 6px #9c4100, 9px 6px #9c4100, 10px 6px #000, 11px 6px #fff, 12px 6px #9c4100, 13px 6px #9c4100, 14px 6px #9c4100,
      1px 7px #9c4100, 2px 7px #9c4100, 3px 7px #9c4100, 4px 7px #9c4100, 5px 7px #9c4100, 6px 7px #9c4100, 7px 7px #9c4100, 8px 7px #9c4100, 9px 7px #9c4100, 10px 7px #9c4100, 11px 7px #9c4100, 12px 7px #9c4100, 13px 7px #9c4100, 14px 7px #9c4100,
      4px 8px #ffd8a8, 5px 8px #ffd8a8, 6px 8px #ffd8a8, 7px 8px #ffd8a8, 8px 8px #ffd8a8, 9px 8px #ffd8a8, 10px 8px #ffd8a8, 11px 8px #ffd8a8,
      3px 9px #ffd8a8, 4px 9px #ffd8a8, 5px 9px #ffd8a8, 6px 9px #ffd8a8, 7px 9px #ffd8a8, 8px 9px #ffd8a8, 9px 9px #ffd8a8, 10px 9px #ffd8a8, 11px 9px #ffd8a8, 12px 9px #ffd8a8,
      2px 10px #ffd8a8, 3px 10px #ffd8a8, 4px 10px #ffd8a8, 5px 10px #ffd8a8, 6px 10px #ffd8a8, 7px 10px #ffd8a8, 8px 10px #ffd8a8, 9px 10px #ffd8a8, 10px 10px #ffd8a8, 11px 10px #ffd8a8, 12px 10px #ffd8a8, 13px 10px #ffd8a8,
      1px 11px #000, 2px 11px #000, 3px 11px #000, 4px 11px #000, 5px 11px #ffd8a8, 6px 11px #ffd8a8, 7px 11px #ffd8a8, 8px 11px #ffd8a8, 9px 11px #ffd8a8, 10px 11px #ffd8a8, 11px 11px #000, 12px 11px #000, 13px 11px #000, 14px 11px #000,
      1px 12px #000, 2px 12px #000, 3px 12px #000, 4px 12px #000, 5px 12px #000, 10px 12px #000, 11px 12px #000, 12px 12px #000, 13px 12px #000, 14px 12px #000;
  }
  .goomba.flattened {
    transform: scaleX(2.5) scaleY(0.65) translateY(12px) !important;
  }

  #cleared-banner, #gameover-banner {
    display: none;
    position: absolute;
    top: 110px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.92);
    border: 4px solid #ffd700;
    padding: 18px 40px;
    border-radius: 12px;
    color: #fff;
    text-align: center;
    z-index: 100;
  }
  #gameover-banner { border-color: #e63946; }
  #cleared-banner h2 { margin: 0 0 6px 0; color: #ffd700; font-size: 24px; }
  #gameover-banner h2 { margin: 0 0 6px 0; color: #e63946; font-size: 28px; letter-spacing: 2px; }
  #cleared-banner p, #gameover-banner p { margin: 0; font-size: 14px; color: #eee; }

  #ipad-touch-controller {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 980px;
    background: #171923;
    padding: 12px 20px;
    margin-top: 10px;
    border-radius: 12px;
    border: 2px solid #2d3748;
  }
  .d-pad { display: flex; gap: 15px; }
  .pad-btn {
    width: 75px; height: 55px; background: #2b6cb0; color: white;
    font-size: 18px; font-weight: bold; border: none; border-radius: 10px;
    box-shadow: 0 4px #1a365d; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .pad-btn:active { background: #3182ce; transform: translateY(2px); box-shadow: 0 2px #1a365d; }
  .action-pad { display: flex; gap: 15px; }
  .action-btn {
    width: 110px; height: 55px; background: #dd6b20; color: white;
    font-size: 16px; font-weight: bold; border: none; border-radius: 10px;
    box-shadow: 0 4px #9c4221; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .action-btn:active { background: #ed8936; transform: translateY(2px); box-shadow: 0 2px #9c4221; }

  #controls {
    width: 980px;
    background: #202232;
    padding: 14px 20px;
    margin-top: 10px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .control-row {
    display: flex;
    gap: 12px;
    align-items: center;
    width: 100%;
  }
  .control-row label {
    color: #edf2f4;
    font-size: 13px;
    font-weight: bold;
    min-width: 170px;
  }
  select, input[type="text"], input[type="file"] {
    padding: 7px 12px;
    border: 2px solid #4a4e69;
    background: #15161f;
    color: #fff;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  select { cursor: pointer; }
  input[type="text"] { flex: 1; }
  input[type="file"] { flex: 1; cursor: pointer; }
  
  .btn-base {
    background: #2a9d8f; color: white; border: none; padding: 7px 14px;
    border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 13px;
  }
  .btn-base:hover { background: #21867a; }
  .btn-accent { background: #e76f51; }
  .btn-accent:hover { background: #d45d3f; }
  .btn-danger { background: #e63946; }
  .btn-danger:hover { background: #d90429; }

  .tip {
    width: 980px; color: #8d99ae; font-size: 12px; margin-top: 6px; text-align: center;
  }

  @media screen and (max-width: 1024px) {
    body { transform: scale(0.98); transform-origin: top center; }
  }
</style>
</head>
<body>

<div id="header">
  <div class="hud-badge">
    <span>🚩 <span id="txt-world">World 1-1</span></span>
    <span>❤️ <span id="hearts">❤️❤️❤️</span></span>
    <span>🪙 <strong id="score" style="color: #ffd700;">0</strong></span>
    <span>🎯 Progress: <strong id="progress" style="color: #48bfe3;">1/20</strong></span>
  </div>
  <div class="header-btns">
    <button id="btn-replay" onclick="playAudio()">🌸 🔊 <span id="txt-listen">Listen (Press R)</span></button>
    <button id="btn-admin-skip" onclick="adminSkipLevel()" title="Shortcut: Press N on keyboard">⚡ Skip Level (Press N)</button>
  </div>
</div>

<div id="game-container">
  <div id="left-castle-container"></div>
  <div id="right-castle-container"></div>
  <div id="world2-decorations"></div>
  <div id="piranha-container"></div>
  <div id="hammer-bro-container"></div>

  <div id="mario"><div class="mario-pixel"></div></div>
  <div id="bricks-layout-container"></div>

  <div class="goomba" id="goomba1" style="left: 390px;"><div class="goomba-pixel"></div></div>
  <div class="goomba" id="goomba2" style="left: 750px;"><div class="goomba-pixel"></div></div>

  <div id="cleared-banner">
    <h2>🎉 COURSE CLEAR!</h2>
    <p>Theme Mastered! Loading next curriculum stage...</p>
  </div>

const easyStepsDict = {};
let allSeriesStages = {};
let currentSeriesKey = "HSK1";
let curriculumStages = [];
const defaultBuiltinKeys = ["HSK1", "HSK2", "HSK3", "HSK4", "YCT1", "YCT2", "YCT3", "YCT4", "YCT5", "YCT6", "estcV1_1A", "estcV1_1B", "estcV1_2A", "estcV1_2B", "estcV1_3A", "estcV1_3B", "estcV1_4A", "estcV1_4B", "ESTC", "EasySteps"];

function parseTextToStages(text, seriesName) {
  const lines = text.split(/\r?\n/);
  let currentLessonName = "Lesson 1";
  let stagesMap = {};
  let orderKeys = [];

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;

    if (/^(lesson|les|l\.)\s*\d+/i.test(line) || /^lesson\s+[a-z0-9]+/i.test(line) || /^LESSON\s+\d+/i.test(line)) {
      currentLessonName = line;
      continue;
    }

    let parsed = parseWordDocLine(line);
    if (parsed) {
      easyStepsDict[parsed.zh] = { zh: parsed.zh, py: parsed.py, en: parsed.en };
      let stageName = `${currentLessonName}`;
      if (!stagesMap[stageName]) {
        stagesMap[stageName] = [];
        orderKeys.push(stageName);
      }
      if (!stagesMap[stageName].includes(parsed.zh)) {
        stagesMap[stageName].push(parsed.zh);
      }
    }
  }

  let stages = [];
  orderKeys.forEach((key, idx) => {
    stages.push({
      key: `${seriesName}_stage_${idx + 1}`,
      name: key,
      words: stagesMap[key]
    });
  });

  if (stages.length === 0) {
    stages.push({ key: `${seriesName}_default`, name: "Lesson 1", words: ["你好", "谢谢", "老师", "学生"] });
  }

  return stages;
}

function parseWordDocLine(line) {
  let dashIdx = line.indexOf('-');
  if (dashIdx === -1) dashIdx = line.indexOf('–');
  let parenIdx = line.indexOf('(');
  if (dashIdx !== -1 && parenIdx !== -1 && parenIdx < dashIdx) {
    let zh = line.substring(0, parenIdx).trim();
    let py = line.substring(parenIdx + 1, line.indexOf(')', parenIdx)).trim();
    let en = line.substring(dashIdx + 1).trim();
    if (zh && en) return { zh: zh, py: py || zh, en: en };
  }

  if (line.includes("：") || (line.includes(":") && !line.includes("http"))) {
    let parts = line.split(/[：:]/);
    if (parts.length >= 2) {
      let rawZh = parts[0].trim();
      let en = parts.slice(1).join(":").trim();
      let pIdx = rawZh.indexOf('(');
      let zh = rawZh, py = rawZh;
      if (pIdx !== -1) {
        zh = rawZh.substring(0, pIdx).trim();
        let endP = rawZh.indexOf(')', pIdx);
        py = (endP !== -1) ? rawZh.substring(pIdx + 1, endP).trim() : zh;
      }
      if (zh && en) return { zh: zh, py: py, en: en };
    }
  }

  if (dashIdx !== -1) {
    let zh = line.substring(0, dashIdx).trim();
    let en = line.substring(dashIdx + 1).trim();
    if (zh && en) return { zh: zh, py: zh, en: en };
  }

  return null;
}

function initAllDatabases() {
  try {
    const savedCustomData = localStorage.getItem('super_mario_custom_vocabularies');
    if (savedCustomData) {
      const parsedCustom = JSON.parse(savedCustomData);
      for (let k in parsedCustom) {
        multiSeriesRawData[k] = parsedCustom[k];
      }
    }
  } catch (e) {
    console.error("Failed to load local custom vocabularies:", e);
  }

  for (let key in multiSeriesRawData) {
    allSeriesStages[key] = parseTextToStages(multiSeriesRawData[key], key);
  }
}

initAllDatabases();
curriculumStages = allSeriesStages[currentSeriesKey];

function getPinyinOnly(word) {
  if (easyStepsDict[word] && easyStepsDict[word].py) return easyStepsDict[word].py;
  return word;
}

function getEnglishAnnotation(word) {
  if (easyStepsDict[word] && easyStepsDict[word].en) return easyStepsDict[word].en;
  return "";
}

function onSeriesChange() {
  const seriesSel = document.getElementById('series-select').value;
  currentSeriesKey = seriesSel;
  curriculumStages = allSeriesStages[seriesSel] || [];
  rebuildPresetSelect();
  currentWorld = 1;
  initWorld();
}

function handleVocabFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    const fileName = file.name.replace(/\.[^/.]+$/, "");
    
    multiSeriesRawData[fileName] = content;
    allSeriesStages[fileName] = parseTextToStages(content, fileName);
    
    try {
      let customData = {};
      const existing = localStorage.getItem('super_mario_custom_vocabularies');
      if (existing) customData = JSON.parse(existing);
      customData[fileName] = content;
      localStorage.setItem('super_mario_custom_vocabularies', JSON.stringify(customData));
    } catch (err) {
      console.error("Failed to save vocabularies to localStorage:", err);
    }
    
    const seriesSel = document.getElementById('series-select');
    let exists = false;
    for (let i = 0; i < seriesSel.options.length; i++) {
      if (seriesSel.options[i].value === fileName) {
        exists = true;
        break;
      }
    }
    if (!exists) {
      let opt = document.createElement('option');
      opt.value = fileName;
      opt.innerText = `📁 ${fileName} (已保存)`;
      seriesSel.appendChild(opt);
    }
    
    seriesSel.value = fileName;
    currentSeriesKey = fileName;
    curriculumStages = allSeriesStages[fileName];
    
    rebuildPresetSelect();
    currentWorld = 1;
    initWorld();
    alert(`成功加载并永久保存词汇文件: ${file.name}！`);
  };
  reader.readAsText(file);
}

function deleteCurrentCustomVocab() {
  const seriesSel = document.getElementById('series-select');
  const selectedKey = seriesSel.value;

  if (defaultBuiltinKeys.includes(selectedKey)) {
    alert("内置教材体系无法删除！");
    return;
  }

  if (confirm(`确定要删除自定义词汇表 "${selectedKey}" 吗？`)) {
    delete multiSeriesRawData[selectedKey];
    delete allSeriesStages[selectedKey];

    try {
      const existing = localStorage.getItem('super_mario_custom_vocabularies');
      if (existing) {
        let customData = JSON.parse(existing);
        delete customData[selectedKey];
        localStorage.setItem('super_mario_custom_vocabularies', JSON.stringify(customData));
      }
    } catch (err) {
      console.error("Failed to delete from localStorage:", err);
    }

    for (let i = 0; i < seriesSel.options.length; i++) {
      if (seriesSel.options[i].value === selectedKey) {
        seriesSel.remove(i);
        break;
      }
    }

    seriesSel.value = "HSK1";
    currentSeriesKey = "HSK1";
    curriculumStages = allSeriesStages["HSK1"];
    rebuildPresetSelect();
    currentWorld = 1;
    initWorld();
    alert(`词汇表 "${selectedKey}" 已成功删除！`);
  }
}

function rebuildPresetSelect() {
  const sel = document.getElementById('preset-select');
  sel.innerHTML = '';
  curriculumStages.forEach(s => {
    let opt = document.createElement('option');
    opt.value = s.key;
    opt.innerText = `${s.name} (${s.words.length} words)`;
    sel.appendChild(opt);
  });
}

function onPresetChange() {
  const sel = document.getElementById('preset-select').value;
  const foundIdx = curriculumStages.findIndex(s => s.key === sel);
  if (foundIdx !== -1) {
    currentWorld = foundIdx + 1;
    initWorld();

}

function addEnglishWordFromEudic() {
  const inputEl = document.getElementById('english-input');
  const query = inputEl.value.trim().toLowerCase();
  if (!query) return;
  let matchedZh = null;
  for (let zh in easyStepsDict) {
    if (easyStepsDict[zh].en.toLowerCase() === query || easyStepsDict[zh].en.toLowerCase().includes(query)) {
      matchedZh = zh;
      break;
    }
  }
  if (matchedZh) {
    appendWordToCustomList(matchedZh);
    inputEl.value = '';
  } else {
    alert(`No exact match found for English meaning "${query}".`);
  }
}

function appendWordToCustomList(zhWord) {
  const customInput = document.getElementById('custom-words');
  let currentList = customInput.value.split(/[,，\s]+/).map(w => w.trim()).filter(w => w.length > 0);
  if (!currentList.includes(zhWord)) {
    currentList.push(zhWord);
    customInput.value = currentList.join(', ');
    updateWords();
  } else {
    alert(`"${zhWord}" is already in the list!`);
  }
}

let localVoices = [];
function loadVoices() {
  if ('speechSynthesis' in window) localVoices = window.speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function findGentleVoice() {
  if (!localVoices.length && 'speechSynthesis' in window) localVoices = window.speechSynthesis.getVoices();
  const keywords = ['xiaoxiao', 'tingting', 'ting-ting', 'sinji', 'huihui', 'natural', 'chinese', 'zh-cn'];
  for (let kw of keywords) {
    const match = localVoices.find(v => (v.lang.includes('zh') || v.lang.includes('cmn')) && v.name.toLowerCase().includes(kw));
    if (match) return match;
  }
  return localVoices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
}

function playAudio() {
  if (!currentTarget || !('speechSynthesis' in window) || isClearing || isDying || isSpawning || allQuestionsCleared) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(currentTarget);
  utter.lang = 'zh-CN';
  utter.rate = 0.72;
  utter.pitch = 1.05;
  const v = findGentleVoice();
  if (v) utter.voice = v;
  window.speechSynthesis.speak(utter);
}

  if (!curriculumStages.length) return { name: "Default", words: ["你好"] };
  const idx = (currentWorld - 1) % curriculumStages.length;

}

  const curr = getCurrentCurriculum();

function triggerMarioFallAndRestart() {
  if (isDying || isClearing || isSpawning) return;
  isDying = true;
  keys.left = false;
  keys.right = false;
  hp--;
  updateHUD();

  const marioEl = document.getElementById('mario');
  marioEl.style.zIndex = '50';

  if (hp <= 0) {
    playGameOverJingle();
    document.getElementById('gameover-banner').style.display = 'block';
    const goTimer = setInterval(() => {
      velY -= 0.85;
      posY += velY;
      marioEl.style.bottom = posY + 'px';
      if (posY < -100) {
        clearInterval(goTimer);
        document.getElementById('gameover-banner').style.display = 'none';
        marioEl.style.zIndex = '15';
        hp = 3; score = 0;
        initWorld();
      }
    }, 20);
  } else {
    playDeathSound();
    velX = 0;
    velY = 12;
    const fallTimer = setInterval(() => {
      velY -= 0.85;
      posY += velY;
      marioEl.style.bottom = posY + 'px';
      if (posY < -80) {
        clearInterval(fallTimer);
        marioEl.style.zIndex = '15';
        initWorld();
      }
    }, 20);
  }
}

function startCastleWalkOutSequence() {
  isSpawning = true;
  facingRight = true;
  posX = 40;
  const stage = getStageNum();
  posY = (stage === 3) ? 115 : 64;  
  prevPosY = posY;  
  velX = 0; velY = 0;
  isGrounded = true;

  const marioEl = document.getElementById('mario');
  marioEl.style.opacity = '0';
  marioEl.style.left = posX + 'px';
  marioEl.style.bottom = posY + 'px';

  setTimeout(playSpawningSound, 100);

  let walkStep = 0;
  const walkInterval = setInterval(() => {
    walkStep++;
    posX += 1.2;
    marioEl.style.opacity = Math.min(1, walkStep * 0.08);
    marioEl.style.left = posX + 'px';
    if (posX >= 70) {
      clearInterval(walkInterval);
      posX = 70;
      posY = (stage === 3) ? 115 : 64;
      marioEl.style.bottom = posY + 'px';
      marioEl.style.opacity = '1';
      isSpawning = false;
      setTimeout(playAudio, 300);
    }
  }, 25);
}

function initWorld() {
  const curr = getCurrentCurriculum();
  document.getElementById('preset-select').value = curr.key;
  document.getElementById('custom-words').value = curr.words.join(', ');

  stageTargetQueue = [...curr.words].sort(() => Math.random() - 0.5);

  currentStep = 0;
  allQuestionsCleared = false;
  isClearing = false;
  isDying = false;

  goombas[0].alive = true; goombas[0].x = 390;
  document.getElementById('goomba1').classList.remove('flattened');

  goombas[1].alive = true; goombas[1].x = 750;
  document.getElementById('goomba2').classList.remove('flattened');

  document.getElementById('cleared-banner').style.display = 'none';

  renderMapEnvironment();
  updateHUD();
  renderBlocks();
  startCastleWalkOutSequence();
}

  if (isClearing) return;

    currentTarget = "";
    updateHUD();
    return;
  }

  currentTarget = stageTargetQueue[currentStep];

  const curr = getCurrentCurriculum();
  let otherWords = curr.words.filter(w => w !== currentTarget).sort(() => Math.random() - 0.5);
  let distractors = otherWords.slice(0, 3);
  
  const fallback = ["中", "国", "人", "书"];
  let fIdx = 0;
  while (distractors.length < 3) {
    distractors.push(fallback[fIdx % fallback.length]);

  let options = [currentTarget, distractors[0], distractors[1], distractors[2]].sort(() => Math.random() - 0.5);

    const charLen = text.length;
    const enText = getEnglishAnnotation(text);
    const enLen = enText.length;
    const base = Math.max(75, charLen * 28 + 24, enLen * 7 + 20);
    return Math.min(base, 160);

    ];

    sBricksData = [
      { x: 220, y: 195, w: 100, h: 36 },
      { x: 420, y: 195, w: 160, h: 55 },
      { x: 420, y: 140, w: 32, h: 55 },
      { x: 720, y: 195, w: 80, h: 36 },
    ];
  } else if (stage === 8) {
    qBlocksData = [
      { x: 150, y: 175, text: options[0], w: getDynamicWidth(options[0]) },
      { x: 340, y: 295, text: options[1], w: getDynamicWidth(options[1]) },
      { x: 520, y: 195, text: options[2], w: getDynamicWidth(options[2]) },
      { x: 760, y: 215, text: options[3], w: getDynamicWidth(options[3]) }
    ];

    sBricksData = [
      { x: 110, y: 175, w: 50, h: 40 },
      { x: 230, y: 175, w: 40, h: 40 },
      { x: 300, y: 175, w: 80, h: 40 },
      { x: 490, y: 195, w: 40, h: 40 },
      { x: 160, y: 295, w: 40, h: 40 },
      { x: 800, y: 295, w: 40, h: 40 },
      { x: 380, y: 395, w: 40, h: 40 },
      { x: 830, y: 215, w: 70, h: 40 }
    ];
  } else {
    const boxX = 380;
    const boxY = 160;
    const boxHeight = 180;
    const bSizeW = 70;
    const bSizeH = 50;

    sBricksData.push({ x: boxX, y: boxY + boxHeight, w: bSizeW, h: bSizeH });
    qBlocksData.push({ x: boxX + bSizeW, y: boxY + boxHeight, w: Math.max(bSizeW, getDynamicWidth(options[0])), h: bSizeH, text: options[0] });
    sBricksData.push({ x: boxX + bSizeW * 2, y: boxY + boxHeight, w: bSizeW, h: bSizeH });

    sBricksData.push({ x: boxX, y: boxY, w: bSizeW, h: bSizeH });
    qBlocksData.push({ x: boxX + bSizeW, y: boxY, w: Math.max(bSizeW, getDynamicWidth(options[1])), h: bSizeH, text: options[1] });
    sBricksData.push({ x: boxX + bSizeW * 2, y: boxY, w: bSizeW, h: bSizeH });

    sBricksData.push({ x: boxX, y: boxY + bSizeH, w: bSizeW, h: bSizeH });
    sBricksData.push({ x: boxX + bSizeW * 2, y: boxY + bSizeH, w: bSizeW, h: bSizeH });

    qBlocksData.push({ x: 660, y: 170, w: getDynamicWidth(options[2]), h: 56, text: options[2] });
    qBlocksData.push({ x: 820, y: 140, w: getDynamicWidth(options[3]), h: 56, text: options[3] });

    sBricksData.push({ x: 780, y: 220, w: 130, h: 32 });
  }

  sBricksData.forEach(sb => {
    const el = document.createElement('div');
    el.className = sb.isSlab ? 'slab-brick' : 'solid-brick';
    el.style.left = sb.x + 'px';
    el.style.bottom = sb.y + 'px';
    el.style.width = sb.w + 'px';
    el.style.height = sb.h + 'px';
    container.appendChild(el);
    dynamicSolidBricks.push({ x: sb.x, y: sb.y, w: sb.w, h: sb.h, el: el });
  });

  qBlocksData.forEach(qb => {
    const charArray = qb.text.split('');
    const b = document.createElement('div');
    b.className = 'block';
    if (qb.isStrip) b.classList.add('w4-strip-block');
    if (charArray.length > 1) b.classList.add('multi-char');
    b.style.left = qb.x + 'px';
    b.style.bottom = qb.y + 'px';
    
    const bWidth = qb.w;
    const bHeight = qb.h || 56;
    b.style.width = bWidth + 'px'; 
    b.style.height = bHeight + 'px';

    const dotsContainer = document.createElement('div');
    dotsContainer.className = 'block-corner-dots';
    b.appendChild(dotsContainer);

    const zhRow = document.createElement('div');
    zhRow.className = 'block-zh-row';
    charArray.forEach(char => {
      const charSpan = document.createElement('span');
      charSpan.className = 'block-text-char';
      charSpan.style.fontSize = charArray.length > 3 ? '16px' : (charArray.length > 2 ? '18px' : '24px');
      charSpan.innerText = char;
      zhRow.appendChild(charSpan);
    });
    b.appendChild(zhRow);

    const enDiv = document.createElement('div');
    enDiv.className = 'block-sub-en';
    const enText = getEnglishAnnotation(qb.text);
    enDiv.innerText = enText;
    enDiv.style.fontSize = '12px';

    b.appendChild(enDiv);

    container.appendChild(b);
    dynamicQuestionBlocks.push({ x: qb.x, y: qb.y, w: bWidth, h: bHeight, text: qb.text, el: b });
  });

  updateHUD();
  if (!isSpawning) setTimeout(playAudio, 300);
}

function updateWords() {
  const input = document.getElementById('custom-words').value;
  const list = input.split(/[,，\s]+/).filter(w => w.trim().length > 0);
  if (list.length >= 4) {
    stageTargetQueue = [...list].sort(() => Math.random() - 0.5);
    currentStep = 0;
    allQuestionsCleared = false;
    updateHUD();
    renderBlocks();
  } else {
    alert("Please enter at least 4 words!");
  }
}

function createHintFlyPop(x, y, text) {
  const pinyinText = getPinyinOnly(text);
  const pop = document.createElement('div');
  pop.className = 'hint-fly-pop';
  pop.innerText = pinyinText;
  pop.style.left = (x + 6) + 'px';
  pop.style.bottom = (y + 58) + 'px';
  document.getElementById('game-container').appendChild(pop);
  setTimeout(() => pop.remove(), 950);
}

function enterCastleAndAdvance() {
  if (isClearing) return;
  isClearing = true;
  keys.left = false;
  keys.right = false;
  playClearFanfare();

  const marioEl = document.getElementById('mario');
  document.getElementById('cleared-banner').style.display = 'block';

  let fadeStep = 0;
  const fadeTimer = setInterval(() => {
    fadeStep++;
    marioEl.style.opacity = Math.max(0, 1 - fadeStep * 0.15);
    if (fadeStep >= 7) {
      clearInterval(fadeTimer);
      marioEl.style.opacity = '0';
      setTimeout(() => {
        currentWorld= ((currentWorld) % curriculumStages.length) + 1;
        initWorld();
      }, 1800);
    }
  }, 40);
}

function gameLoop() {
  const stage = getStageNum();

  if (stage === 1 || stage === 2) {
    goombas.forEach(g => {
      const el = document.getElementById(g.elId);
      if (g.alive) {
        g.x += g.vx;
        if (g.x <= g.minX || g.x >= g.maxX) g.vx *= -1;
        el.style.left = g.x + 'px';

        if (!isDying && !isClearing && !isSpawning) {
          if (posX + 34 > g.x && posX < g.x + 36 && posY + 40 > g.y && posY < g.y + 36) {
            if (velY < 0 && posY >= g.y + 16) {
              playStompSound();
              g.alive = false;
              el.classList.add('flattened');
              velY = 11;
              score += 100;
              updateHUD();
              setTimeout(() => {
                g.alive = true;
                g.x = (g.minX + g.maxX) / 2;
                el.classList.remove('flattened');
              }, 4000);
            } else {
              triggerMarioFallAndRestart();
            }
          }
        }
      }
    });
  }

  if (stage === 3 || stage === 5 || stage === 8) {
    dynamicPiranhas.forEach(p => {
      if (p.pauseTimer > 0) {
        p.pauseTimer--;
      } else {
        p.currentY += p.speed * p.dir;
        if (p.dir > 0 && p.currentY >= p.peakY) {
          p.currentY = p.peakY;
          p.dir = -1;
          p.pauseTimer = 60;
        } else if (p.dir < 0 && p.currentY <= p.baseY) {
          p.currentY = p.baseY;
          p.dir = 1;
          p.pauseTimer = 55;
        }
      }
      p.el.style.bottom = p.currentY + 'px';

      if (!isDying && !isClearing && !isSpawning) {
        const plantTop = p.currentY + 40;
        const plantBottom = p.currentY + 8;
        const plantLeft = p.x + 8;
        const plantRight = p.x + 28;

        if (posX + MARIO_W - 12 > plantLeft && posX + 12 < plantRight && posY + MARIO_H > plantBottom && posY < plantTop) {
          triggerMarioFallAndRestart();
        }
      }
    });
  }

  if (stage === 4) {
    dynamicHammerBros.forEach(hb => {
      if (hb.alive) {
        hb.x += hb.vx;
        if (hb.x <= hb.minX || hb.x >= hb.maxX) hb.vx *= -1;
        hb.el.style.left = hb.x + 'px';
        hb.el.style.transform = (hb.vx > 0) ? 'scaleX(-1)' : 'scaleX(1)';

        if (!isDying && !isClearing && !isSpawning) {
          if (posX + 32 > hb.x && posX < hb.x + hb.w && posY + 38 > hb.y && posY < hb.y + hb.h) {
            if (velY < 0 && posY >= hb.y + 20) {
              playStompSound();
              hb.alive = false;
              hb.el.classList.add('flattened');
              velY = 11;
              score += 200;
              updateHUD();
              setTimeout(() => {
                hb.alive = true;
                hb.x = (hb.minX + hb.maxX) / 2;
                hb.el.classList.remove('flattened');
              }, 4500);
            } else {
              triggerMarioFallAndRestart();
            }
          }
        }
      }
    });
  }

  if (stage === 5 || stage === 6 || stage === 7 || stage === 8) {
    dynamicStage5Enemies.forEach(en => {
      if (en.alive) {
        en.x += en.vx;
        if (en.x <= en.minX || en.x >= en.maxX) en.vx *= -1;
        en.el.style.left = en.x + 'px';
        en.el.style.transform = (en.vx > 0) ? 'scaleX(-1)' : 'scaleX(1)';

        if (!isDying && !isClearing && !isSpawning) {
          if (posX + MARIO_W - 10 > en.x && posX + 10 < en.x + en.w && posY + MARIO_H > en.y && posY < en.y + en.h) {
            if (velY < 0 && posY >= en.y + 12) {
              playStompSound();
              en.alive = false;
              en.el.classList.add('flattened');
              velY = 11;
              score += 150;
              updateHUD();
              setTimeout(() => {
                en.alive = true;
                en.x = (en.minX + en.maxX) / 2;
                en.el.classList.remove('flattened');
              }, 4000);
            } else {
              triggerMarioFallAndRestart();
            }
          }
        }
      }
    });
  }

  if (!isClearing && !isDying && !isSpawning) {
    if (keys.left) { velX -= ACCEL; facingRight = false; }
    if (keys.right) { velX += ACCEL; facingRight = true; }

    velX *= isGrounded ? FRICTION : 0.92;
    if (Math.abs(velX) > MAX_SPEED) velX = Math.sign(velX) * MAX_SPEED;
    if (Math.abs(velX) < 0.05) velX = 0;
    posX += velX;

    if (posX < 8) { posX = 8; velX = 0; }
    if (posX > 940) { posX = 940; velX = 0; }

    prevPosY = posY;

    if (!isGrounded) {
      velY -= GRAVITY;
      posY += velY;
    }

    let onPlatform = false;
    let platformsToTest = [...dynamicSolidBricks];
    if (!allQuestionsCleared) platformsToTest = platformsToTest.concat(dynamicQuestionBlocks);

    platformsToTest.forEach(plat => {
      if (posX + MARIO_W - 8 > plat.x && posX + 8 < plat.x + plat.w) {
        const platTop = plat.y + plat.h;
        if (velY <= 0 && prevPosY >= platTop - 8 && posY <= platTop + 4) {
          posY = platTop;
          velY = 0;
          isGrounded = true;
          onPlatform = true;
        }
      }
    });

    const baseGroundY = (stage === 3) ? 105 : 64;

    if (!isGrounded) {
      if (!onPlatform && posY <= baseGroundY) {
        posY = baseGroundY;
        velY = 0;
        isGrounded = true;
      }
    } else if (!onPlatform && posY > baseGroundY) {
      isGrounded = false;
    }

    if (!allQuestionsCleared && velY > 0) {
      dynamicQuestionBlocks.forEach(qb => {
        const xOverlap = (posX + MARIO_W - 6 > qb.x) && (posX + 6 < qb.x + qb.w);
        const headY = posY + MARIO_H;
        const prevHeadY = prevPosY + MARIO_H;
        const hitBottom = (prevHeadY <= qb.y + 8 && headY >= qb.y - 12) || (headY >= qb.y - 8 && headY <= qb.y + 28);

        if (xOverlap && hitBottom && velY > 0) {
          velY = -2.2;
          posY = qb.y - MARIO_H - 1;

          qb.el.classList.remove('hit-bounce');
          void qb.el.offsetWidth;
          qb.el.classList.add('hit-bounce');

          if (qb.text === currentTarget) {
            playCoinSound();
            createHintFlyPop(qb.x, qb.y, qb.text);
            qb.el.style.background = "#2a9d8f";
            qb.el.style.borderColor = "#1f6f66";
            qb.el.style.color = "#fff";

            currentStep++;
            setTimeout(renderBlocks, 500);
          } else {
            playDeathSound();
            qb.el.style.background = "#e63946";
            qb.el.style.borderColor = "#9d0208";
            qb.el.style.color = "#fff";
            setTimeout(playAudio, 350);
          }
        }
      });

      dynamicSolidBricks.forEach(brick => {
        if (!brick.el) return;
        const xOverlap = (posX + MARIO_W - 6 > brick.x) && (posX + 6 < brick.x + brick.w);
        const headY = posY + MARIO_H;
        const prevHeadY = prevPosY + MARIO_H;
        const hitBottom = (prevHeadY <= brick.y + 8 && headY >= brick.y - 10) || (headY >= brick.y - 6 && headY <= brick.y + 26);

        if (xOverlap && hitBottom && velY > 0) {
          velY = -2;
          posY = brick.y - MARIO_H - 1;
          brick.el.classList.remove('hit-bounce');
          void brick.el.offsetWidth;
          brick.el.classList.add('hit-bounce');
          playTone(300, 'square', 0.08, 0.1);
        }
      });
    }

    if (allQuestionsCleared && posX >= rightCastleDoorX) {
      enterCastleAndAdvance();
    }

    const marioEl = document.getElementById('mario');
    marioEl.style.left = posX + 'px';
    marioEl.style.bottom = posY + 'px';
    const scaleX = facingRight ? 2.8 : -2.8;
    marioEl.style.transform = `scaleX(${scaleX}) scaleY(2.8)`;
  }

  requestAnimationFrame(gameLoop);
}

function bindTouchButton(btnId, keyName, isJump = false) {
  const btn = document.getElementById(btnId);
  if (!btn) return;

  const handleStart = (e) => {
    e.preventDefault();
    ensureAudio();
    if (isJump) {
      if (isGrounded && !isClearing && !isDying && !isSpawning) {
        velY = JUMP_FORCE;
        isGrounded = false;
      }
    } else {
      keys[keyName] = true;
    }
  };

  const handleEnd = (e) => {
    e.preventDefault();
    if (!isJump) keys[keyName] = false;
  };

  btn.addEventListener('touchstart', handleStart, { passive: false });
  btn.addEventListener('touchend', handleEnd, { passive: false });
  btn.addEventListener('mousedown', handleStart);
  btn.addEventListener('mouseup', handleEnd);
  btn.addEventListener('mouseleave', handleEnd);
}

bindTouchButton('btn-left', 'left');
bindTouchButton('btn-right', 'right');
bindTouchButton('btn-jump', null, true);

window.addEventListener('keydown', (e) => {
  ensureAudio();
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (isClearing || isDying || isSpawning) return;

  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    if (!e.repeat && isGrounded) {
      velY = JUMP_FORCE;
      isGrounded = false;
    }
    e.preventDefault();
  }
  if (e.code === 'KeyR') playAudio();
  if (e.code === 'KeyN') adminSkipLevel();
});

window.addEventListener('keyup', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

function initSeriesDropdown() {
  const seriesSel = document.getElementById('series-select');
  try {
    const savedCustomData = localStorage.getItem('super_mario_custom_vocabularies');
    if (savedCustomData) {
      const parsedCustom = JSON.parse(savedCustomData);
      for (let fileName in parsedCustom) {
        let exists = false;
        for (let i = 0; i < seriesSel.options.length; i++) {
          if (seriesSel.options[i].value === fileName) {
            exists = true;
            break;
          }
        }
        if (!exists) {
          let opt = document.createElement('option');
          opt.value = fileName;
          opt.innerText = `📁 ${fileName} (已保存)`;
          seriesSel.appendChild(opt);
        }
      }
    }
  } catch (e) {
    console.error(e);
  }
}

initSeriesDropdown();
document.getElementById('series-select').value = "HSK1";
rebuildPresetSelect();
initWorld();
requestAnimationFrame(gameLoop);
</script>
